name: Validate contracts
on:
  push:
    branches: [main, prod]
  pull_request:
  schedule:
    - cron: "31 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solana-unit-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix:
        flow: [approval, limits]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test portable policy behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-policy.py
          rustc --edition=2021 --test scripts/policy-smoke.rs -o "$RUNNER_TEMP/policy-smoke"
          "$RUNNER_TEMP/policy-smoke" "${{ matrix.flow }}" --nocapture | tee "$RUNNER_TEMP/policy.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/policy.log"
  contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check source identity and formatting
        run: |
          python3 scripts/check-policy.py
          cargo fmt --all --check
          cargo fmt --manifest-path sbf-tests/Cargo.toml --check
      - name: Native Rust unit tests
        run: cargo test --workspace --locked
