name: Validate contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Check shared policy identity and formatting
        run: |
          python3 scripts/check-policy.py
          cargo fmt --all --check
      - name: Install pinned Agave toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libudev-dev pkg-config
          curl -fsSL https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/agave.tar.bz2
          echo 'c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8  /tmp/agave.tar.bz2' | sha256sum -c -
          tar -xjf /tmp/agave.tar.bz2 -C /tmp
          echo /tmp/solana-release/bin >> "$GITHUB_PATH"
      - name: Native Rust tests
        run: cargo test --workspace --locked
      - name: Compile native programs and execute real token CPIs
        run: |
          cargo build-sbf --manifest-path programs/policy/Cargo.toml --arch v3 --optimize-size --tools-version v1.57 -- --locked
          cargo build-sbf --manifest-path programs/vault/Cargo.toml --arch v3 --optimize-size --tools-version v1.57 -- --locked
          cargo fmt --manifest-path sbf-tests/Cargo.toml --check
          SBF_OUT_DIR="$PWD/target/deploy" cargo test --manifest-path sbf-tests/Cargo.toml --locked
