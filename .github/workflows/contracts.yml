name: Validate contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: solana-unit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check source identity and formatting
        run: |
          python3 scripts/check-policy.py
          cargo fmt --all --check
          cargo fmt --manifest-path sbf-tests/Cargo.toml --check
      - name: Native Rust unit tests
        run: cargo test --workspace --locked
