name: Whirlpool integration smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full integration regression suite
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: solana-whirlpool-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            sbf-tests -> target
      - name: Install pinned Agave toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libudev-dev pkg-config
          curl -fsSL https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/agave.tar.bz2
          echo 'c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8  /tmp/agave.tar.bz2' | sha256sum -c -
          tar -xjf /tmp/agave.tar.bz2 -C /tmp
          echo /tmp/solana-release/bin >> "$GITHUB_PATH"
      - name: Compile PaySH and the pinned Whirlpool program
        run: |
          cargo build-sbf --manifest-path programs/paysh/Cargo.toml --arch v3 --optimize-size --tools-version v1.57 -- --locked
          bash scripts/build-whirlpool-test.sh
      - name: Smoke a real Whirlpool full-input swap
        shell: bash
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/target/deploy
        run: |
          set -euo pipefail
          cargo test --manifest-path sbf-tests/Cargo.toml --locked --test paysh_whirlpool real_whirlpool_full_input_preserves_prior_wsol_and_records_budget -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -F "1 passed; 0 failed" "$RUNNER_TEMP/smoke.log"
      - name: Full Whirlpool regressions
        if: github.event_name == 'workflow_dispatch' && inputs.full
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/target/deploy
        run: cargo test --manifest-path sbf-tests/Cargo.toml --locked --test paysh_whirlpool
