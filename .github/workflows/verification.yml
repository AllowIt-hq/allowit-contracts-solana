name: Verification
on:
  pull_request:
    paths: ["verification/**", ".github/workflows/verification.yml"]
  push:
    branches: [main]
    paths: ["verification/**", ".github/workflows/verification.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: python3 -m unittest discover -s verification/tests
