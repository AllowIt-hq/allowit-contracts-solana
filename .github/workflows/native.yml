name: Native Solana SDK
on:
  pull_request:
    paths: ["crates/native/**", "native/**", ".github/workflows/native.yml"]
  push:
    branches: [main]
    paths: ["crates/native/**", "native/**", ".github/workflows/native.yml"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --manifest-path crates/native/Cargo.toml --check
      - run: cargo test --manifest-path crates/native/Cargo.toml --locked
      - run: cargo test --manifest-path crates/native/Cargo.toml --locked --features serde_json/preserve_order
      - run: cargo clippy --manifest-path crates/native/Cargo.toml --locked --all-targets -- -D warnings

  native-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Verify the imported dependency lock matches the package
        working-directory: native
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('package.json'));
          const locked = JSON.parse(fs.readFileSync('package-lock.json')).packages[''];
          for (const key of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            assert.deepEqual(locked[key] ?? {}, manifest[key] ?? {}, `package-lock.json ${key} are stale`);
          }
          // pnpm reads overrides from workspace config rather than npm's field.
          fs.writeFileSync('pnpm-workspace.yaml', `overrides: ${JSON.stringify(manifest.overrides ?? {})}\n`);
          JS
      - run: pnpm import
        working-directory: native
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: native
      - run: pnpm test
        working-directory: native
