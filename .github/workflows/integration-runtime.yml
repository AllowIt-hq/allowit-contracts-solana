name: Solana runtime smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full integration regression suite
        type: boolean
        default: false
      deploy:
        description: Deploy the pinned native release immutably to Solana Devnet
        type: boolean
        default: false
      reviewed_sha:
        description: Exact reviewed workflow commit SHA (required for deployment)
        type: string
        default: ""
      confirmation:
        description: Type deploy-immutable-622f8b-to-solana-devnet
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: solana-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  PINNED_NATIVE_REVISION: 622f8b8054b4a8c533ae9ebd4978c48f7ea9c628
  PINNED_SOURCE_BUNDLE: 793db01595fbcb15503914744e49b45f470e9ca1d2805aceadeac00a0d843fc7
  PINNED_POLICY_BYTES: "1696"
  PINNED_POLICY_SHA256: cb55e2015dbc437cce58a53727c947cd1d8db75453623c5e53a4e4ea15b40dde
  PINNED_VAULT_BYTES: "110680"
  PINNED_VAULT_SHA256: 92e1849f9072fb0c342b8cd4513faa5e575b77ee903397dde1fe06bb0f3fcae0
  DEVNET_GENESIS_HASH: EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG
  DEVNET_USDC_MINT: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
  AGAVE_ARCHIVE_SHA256: c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@16c20dfc2b8bc5cd72c3bf5072a9453664776e70 # 1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: solana-integration-runtime
          workspaces: |
            . -> target
            sbf-tests -> target
      - name: Install pinned Agave toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libudev-dev pkg-config
          curl -fsSL https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$RUNNER_TEMP/agave.tar.bz2"
          echo "$AGAVE_ARCHIVE_SHA256  $RUNNER_TEMP/agave.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Compile local runtime programs
        run: |
          set -euo pipefail
          cargo build-sbf --manifest-path programs/policy/Cargo.toml --arch v3 --optimize-size --tools-version v1.57 -- --locked
          cargo build-sbf --manifest-path programs/vault/Cargo.toml --arch v3 --optimize-size --tools-version v1.57 -- --locked
          cargo build-sbf --manifest-path programs/paysh/Cargo.toml --arch v3 --optimize-size --tools-version v1.57 -- --locked
      - name: Smoke compiled vault and PaySH token transfers
        shell: bash
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/target/deploy
        run: |
          set -euo pipefail
          cargo test --manifest-path sbf-tests/Cargo.toml --locked --test vault real_cpi_transfer_daily_limits_nonce_and_day_rollover -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -F "1 passed; 0 failed" "$RUNNER_TEMP/smoke.log"
          cargo test --manifest-path sbf-tests/Cargo.toml --locked --test paysh pays_fee_then_pays_vendor_and_consumes_nonce -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -F "1 passed; 0 failed" "$RUNNER_TEMP/smoke.log"
      - name: Full local runtime regressions
        if: github.event_name == 'workflow_dispatch' && inputs.full
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/target/deploy
        run: cargo test --manifest-path sbf-tests/Cargo.toml --locked --test vault --test paysh

  native_release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the reviewed native contract release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.PINNED_NATIVE_REVISION }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@16c20dfc2b8bc5cd72c3bf5072a9453664776e70 # 1.98.0
        with:
          components: rustfmt
      - name: Install pinned Agave toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libudev-dev pkg-config
          curl -fsSL https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$RUNNER_TEMP/agave.tar.bz2"
          echo "$AGAVE_ARCHIVE_SHA256  $RUNNER_TEMP/agave.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Verify source identity and host tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_NATIVE_REVISION"
          test "$(python3 scripts/check-policy.py)" = "$PINNED_SOURCE_BUNDLE"
          cargo fmt --all --check
          cargo test --workspace --locked
      - name: Build exact policy and custody programs
        run: |
          set -euo pipefail
          cargo build-sbf --manifest-path programs/policy/Cargo.toml --arch v3 --optimize-size --tools-version v1.57 -- --locked
          cargo build-sbf --manifest-path programs/vault/Cargo.toml --arch v3 --optimize-size --tools-version v1.57 -- --locked
      - name: Run full compiled vault regression suite
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/target/deploy
        run: |
          set -euo pipefail
          cargo fmt --manifest-path sbf-tests/Cargo.toml --check
          cargo test --manifest-path sbf-tests/Cargo.toml --locked --test vault -- --nocapture
      - name: Package only the pinned public release
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/native-release"
          mkdir -p "$release_dir"
          install -m 0444 target/deploy/allowit_policy.so "$release_dir/allowit_policy.so"
          install -m 0444 target/deploy/allowit_vault.so "$release_dir/allowit_vault.so"
          test "$(stat -c %s "$release_dir/allowit_policy.so")" = "$PINNED_POLICY_BYTES"
          test "$(sha256sum "$release_dir/allowit_policy.so" | cut -d' ' -f1)" = "$PINNED_POLICY_SHA256"
          test "$(stat -c %s "$release_dir/allowit_vault.so")" = "$PINNED_VAULT_BYTES"
          test "$(sha256sum "$release_dir/allowit_vault.so" | cut -d' ' -f1)" = "$PINNED_VAULT_SHA256"
          python3 - "$release_dir/release.json" <<'PY'
          import json, os, pathlib, sys
          release = {
              "schema": 1,
              "network": "solana:devnet",
              "genesisHash": os.environ["DEVNET_GENESIS_HASH"],
              "contractRevision": os.environ["PINNED_NATIVE_REVISION"],
              "workflowRevision": os.environ["GITHUB_SHA"],
              "sourceBundle": os.environ["PINNED_SOURCE_BUNDLE"],
              "toolchain": {
                  "rust": "1.98.0",
                  "agave": "4.3.0",
                  "platformTools": "1.57",
                  "sbfArch": "v3",
              },
              "mint": os.environ["DEVNET_USDC_MINT"],
              "artifacts": {
                  "policy": {
                      "file": "allowit_policy.so",
                      "bytes": int(os.environ["PINNED_POLICY_BYTES"]),
                      "sha256": os.environ["PINNED_POLICY_SHA256"],
                  },
                  "vault": {
                      "file": "allowit_vault.so",
                      "bytes": int(os.environ["PINNED_VAULT_BYTES"]),
                      "sha256": os.environ["PINNED_VAULT_SHA256"],
                  },
              },
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(release, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$release_dir"
            sha256sum allowit_policy.so allowit_vault.so release.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Upload exact native release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-release-${{ github.sha }}
          path: ${{ runner.temp }}/native-release
          if-no-files-found: error
          retention-days: 1


  deploy_devnet:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy &&
      inputs.full &&
      github.repository == 'AllowIt-hq/allowit-contracts-solana' &&
      github.ref == 'refs/heads/codex/devnet-deployment-guide' &&
      github.actor == 'beriktassuly'
    needs: [smoke, native_release]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Enforce independently reviewed workflow and public bindings
        env:
          REVIEWED_SHA_INPUT: ${{ inputs.reviewed_sha }}
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
          REVIEWED_SHA_REPOSITORY: ${{ vars.ALLOWIT_DEVNET_REVIEWED_WORKFLOW_SHA }}
          EXPECTED_DEPLOYER: ${{ vars.ALLOWIT_DEVNET_DEPLOYER_PUBLIC_KEY }}
          EXPECTED_POLICY_PROGRAM: ${{ vars.ALLOWIT_DEVNET_POLICY_PROGRAM_ID }}
          EXPECTED_VAULT_PROGRAM: ${{ vars.ALLOWIT_DEVNET_VAULT_PROGRAM_ID }}
          EXPECTED_POLICY_BUFFER: ${{ vars.ALLOWIT_DEVNET_POLICY_BUFFER_PUBLIC_KEY }}
          EXPECTED_VAULT_BUFFER: ${{ vars.ALLOWIT_DEVNET_VAULT_BUFFER_PUBLIC_KEY }}
          EXPECTED_EXECUTOR: ${{ vars.ALLOWIT_DEVNET_EXECUTOR_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AllowIt-hq/allowit-contracts-solana"
          test "$GITHUB_REF" = "refs/heads/codex/devnet-deployment-guide"
          test "$GITHUB_ACTOR" = "beriktassuly"
          test "$CONFIRMATION_INPUT" = "deploy-immutable-622f8b-to-solana-devnet"
          test "$REVIEWED_SHA_INPUT" = "$GITHUB_SHA"
          test "$REVIEWED_SHA_REPOSITORY" = "$GITHUB_SHA"
          python3 - <<'PY'
          import os
          alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          names = [
              "EXPECTED_DEPLOYER",
              "EXPECTED_POLICY_PROGRAM",
              "EXPECTED_VAULT_PROGRAM",
              "EXPECTED_POLICY_BUFFER",
              "EXPECTED_VAULT_BUFFER",
              "EXPECTED_EXECUTOR",
          ]
          values = [os.environ.get(name, "") for name in names]
          if any(not value for value in values):
              raise SystemExit("all Devnet public identity variables must be configured")
          if len(set(values)) != len(values):
              raise SystemExit("all Devnet deployer, program, buffer and executor identities must differ")
          for name, value in zip(names, values):
              if any(character not in alphabet for character in value):
                  raise SystemExit(f"{name} is not a base58 Solana public key")
              number = 0
              for character in value:
                  number = number * 58 + alphabet.index(character)
              raw = number.to_bytes((number.bit_length() + 7) // 8, "big")
              decoded = b"\0" * (len(value) - len(value.lstrip("1"))) + raw
              if len(decoded) != 32:
                  raise SystemExit(f"{name} is not a 32-byte Solana public key")
          PY
      - name: Install pinned Devnet deployment CLI
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$RUNNER_TEMP/agave.tar.bz2"
          echo "$AGAVE_ARCHIVE_SHA256  $RUNNER_TEMP/agave.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Download the same-run native release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-release-${{ github.sha }}
          path: ${{ runner.temp }}/native-release
      - name: Re-verify release identity before loading secrets
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/native-release"
          (cd "$release_dir" && sha256sum -c SHA256SUMS)
          test "$(stat -c %s "$release_dir/allowit_policy.so")" = "$PINNED_POLICY_BYTES"
          test "$(sha256sum "$release_dir/allowit_policy.so" | cut -d' ' -f1)" = "$PINNED_POLICY_SHA256"
          test "$(stat -c %s "$release_dir/allowit_vault.so")" = "$PINNED_VAULT_BYTES"
          test "$(sha256sum "$release_dir/allowit_vault.so" | cut -d' ' -f1)" = "$PINNED_VAULT_SHA256"
          python3 - "$release_dir/release.json" <<'PY'
          import json, os, pathlib, sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert release["network"] == "solana:devnet"
          assert release["genesisHash"] == os.environ["DEVNET_GENESIS_HASH"]
          assert release["contractRevision"] == os.environ["PINNED_NATIVE_REVISION"]
          assert release["workflowRevision"] == os.environ["GITHUB_SHA"]
          assert release["sourceBundle"] == os.environ["PINNED_SOURCE_BUNDLE"]
          assert release["mint"] == os.environ["DEVNET_USDC_MINT"]
          assert release["artifacts"]["policy"] == {
              "file": "allowit_policy.so",
              "bytes": int(os.environ["PINNED_POLICY_BYTES"]),
              "sha256": os.environ["PINNED_POLICY_SHA256"],
          }
          assert release["artifacts"]["vault"] == {
              "file": "allowit_vault.so",
              "bytes": int(os.environ["PINNED_VAULT_BYTES"]),
              "sha256": os.environ["PINNED_VAULT_SHA256"],
          }
          PY
      - name: Decode persistent Devnet-only keypairs
        env:
          DEPLOYER_KEYPAIR_B64: ${{ secrets.ALLOWIT_DEVNET_DEPLOYER_KEYPAIR_B64 }}
          POLICY_PROGRAM_KEYPAIR_B64: ${{ secrets.ALLOWIT_DEVNET_POLICY_PROGRAM_KEYPAIR_B64 }}
          VAULT_PROGRAM_KEYPAIR_B64: ${{ secrets.ALLOWIT_DEVNET_VAULT_PROGRAM_KEYPAIR_B64 }}
          POLICY_BUFFER_KEYPAIR_B64: ${{ secrets.ALLOWIT_DEVNET_POLICY_BUFFER_KEYPAIR_B64 }}
          VAULT_BUFFER_KEYPAIR_B64: ${{ secrets.ALLOWIT_DEVNET_VAULT_BUFFER_KEYPAIR_B64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib
          keys = {
              "DEPLOYER_KEYPAIR_B64": "allowit-devnet-deployer.json",
              "POLICY_PROGRAM_KEYPAIR_B64": "allowit-devnet-policy-program.json",
              "VAULT_PROGRAM_KEYPAIR_B64": "allowit-devnet-vault-program.json",
              "POLICY_BUFFER_KEYPAIR_B64": "allowit-devnet-policy-buffer.json",
              "VAULT_BUFFER_KEYPAIR_B64": "allowit-devnet-vault-buffer.json",
          }
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          for variable, filename in keys.items():
              encoded = os.environ.get(variable, "")
              if not encoded:
                  raise SystemExit(f"required GitHub Actions secret is missing: {variable}")
              try:
                  value = json.loads(base64.b64decode(encoded, validate=True))
              except Exception:
                  raise SystemExit(f"{variable} is not base64 of Solana keypair JSON") from None
              if (
                  not isinstance(value, list)
                  or len(value) != 64
                  or any(type(byte) is not int or not 0 <= byte <= 255 for byte in value)
              ):
                  raise SystemExit(f"{variable} must contain exactly 64 byte values")
              path = root / filename
              path.write_text(json.dumps(value, separators=(",", ":")), encoding="ascii")
              path.chmod(0o600)
          PY
      - name: Verify Devnet, key bindings and mint
        env:
          ALLOWIT_DEVNET_RPC_URL: ${{ secrets.ALLOWIT_DEVNET_RPC_URL }}
          EXPECTED_DEPLOYER: ${{ vars.ALLOWIT_DEVNET_DEPLOYER_PUBLIC_KEY }}
          EXPECTED_POLICY_PROGRAM: ${{ vars.ALLOWIT_DEVNET_POLICY_PROGRAM_ID }}
          EXPECTED_VAULT_PROGRAM: ${{ vars.ALLOWIT_DEVNET_VAULT_PROGRAM_ID }}
          EXPECTED_POLICY_BUFFER: ${{ vars.ALLOWIT_DEVNET_POLICY_BUFFER_PUBLIC_KEY }}
          EXPECTED_VAULT_BUFFER: ${{ vars.ALLOWIT_DEVNET_VAULT_BUFFER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$ALLOWIT_DEVNET_RPC_URL"
          test "$(solana-keygen pubkey "$RUNNER_TEMP/allowit-devnet-deployer.json")" = "$EXPECTED_DEPLOYER"
          test "$(solana-keygen pubkey "$RUNNER_TEMP/allowit-devnet-policy-program.json")" = "$EXPECTED_POLICY_PROGRAM"
          test "$(solana-keygen pubkey "$RUNNER_TEMP/allowit-devnet-vault-program.json")" = "$EXPECTED_VAULT_PROGRAM"
          test "$(solana-keygen pubkey "$RUNNER_TEMP/allowit-devnet-policy-buffer.json")" = "$EXPECTED_POLICY_BUFFER"
          test "$(solana-keygen pubkey "$RUNNER_TEMP/allowit-devnet-vault-buffer.json")" = "$EXPECTED_VAULT_BUFFER"
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ["ALLOWIT_DEVNET_RPC_URL"]
          def rpc(method, params):
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode(),
                  headers={"content-type":"application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except Exception:
                  raise SystemExit(f"Devnet RPC transport failed for {method}") from None
              if "error" in payload:
                  raise SystemExit(f"Devnet RPC rejected {method}")
              return payload["result"]
          genesis = rpc("getGenesisHash", [])
          if genesis != os.environ["DEVNET_GENESIS_HASH"]:
              raise SystemExit(f"refusing non-Devnet genesis: {genesis}")
          mint = rpc("getAccountInfo", [
              os.environ["DEVNET_USDC_MINT"],
              {"encoding":"base64","commitment":"finalized"},
          ])["value"]
          if mint is None or mint["owner"] != "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA":
              raise SystemExit("configured Devnet USDC mint is missing or not classic SPL Token")
          data = base64.b64decode(mint["data"][0])
          if len(data) != 82 or data[44] != 6 or data[45] != 1:
              raise SystemExit("configured Devnet USDC mint is not initialized with six decimals")
          PY
      - name: Deploy or verify exact immutable programs
        env:
          ALLOWIT_DEVNET_RPC_URL: ${{ secrets.ALLOWIT_DEVNET_RPC_URL }}
          EXPECTED_DEPLOYER: ${{ vars.ALLOWIT_DEVNET_DEPLOYER_PUBLIC_KEY }}
          EXPECTED_POLICY_PROGRAM: ${{ vars.ALLOWIT_DEVNET_POLICY_PROGRAM_ID }}
          EXPECTED_VAULT_PROGRAM: ${{ vars.ALLOWIT_DEVNET_VAULT_PROGRAM_ID }}
          EXPECTED_POLICY_BUFFER: ${{ vars.ALLOWIT_DEVNET_POLICY_BUFFER_PUBLIC_KEY }}
          EXPECTED_VAULT_BUFFER: ${{ vars.ALLOWIT_DEVNET_VAULT_BUFFER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/inspect-loader.py" <<'PY'
          import base64, hashlib, json, os, sys, urllib.request
          ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          LOADER = "BPFLoaderUpgradeab1e11111111111111111111111"
          def b58(data):
              zeros = len(data) - len(data.lstrip(b"\0"))
              number = int.from_bytes(data, "big")
              text = ""
              while number:
                  number, index = divmod(number, 58)
                  text = ALPHABET[index] + text
              return "1" * zeros + (text or ("" if zeros else "1"))
          def rpc(address):
              request = urllib.request.Request(
                  os.environ["ALLOWIT_DEVNET_RPC_URL"],
                  data=json.dumps({
                      "jsonrpc":"2.0","id":1,"method":"getAccountInfo",
                      "params":[address,{"encoding":"base64","commitment":"finalized"}],
                  }).encode(),
                  headers={"content-type":"application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except Exception:
                  raise SystemExit("Devnet RPC transport failed while inspecting loader state") from None
              if "error" in payload:
                  raise SystemExit("Devnet RPC rejected loader-state inspection")
              return payload["result"]["value"]
          mode, address, expected_bytes, expected_hash, expected_authority = sys.argv[1:]
          expected_bytes = int(expected_bytes)
          account = rpc(address)
          if account is None:
              print("missing")
              raise SystemExit(0)
          if account["owner"] != LOADER:
              raise SystemExit(f"{mode} address is owned by an unexpected program")
          data = base64.b64decode(account["data"][0])
          if mode == "buffer":
              if account["executable"] or len(data) != 37 + expected_bytes:
                  raise SystemExit("persistent buffer has an unexpected allocation")
              if int.from_bytes(data[:4], "little") != 1 or data[4] != 1:
                  raise SystemExit("persistent buffer has an unexpected loader state")
              if b58(data[5:37]) != expected_authority:
                  raise SystemExit("persistent buffer has an unexpected authority")
              print("buffer")
              raise SystemExit(0)
          if not account["executable"]:
              print("incomplete")
              raise SystemExit(0)
          if len(data) != 36 or int.from_bytes(data[:4], "little") != 2:
              raise SystemExit("program has an unexpected loader state")
          program_data_address = b58(data[4:36])
          program_data_account = rpc(program_data_address)
          if program_data_account is None or program_data_account["owner"] != LOADER:
              raise SystemExit("ProgramData is missing or has an unexpected owner")
          program_data = base64.b64decode(program_data_account["data"][0])
          if len(program_data) != 45 + expected_bytes:
              raise SystemExit("ProgramData does not have the exact reviewed allocation")
          if int.from_bytes(program_data[:4], "little") != 3:
              raise SystemExit("ProgramData has an unexpected loader state")
          option = program_data[12]
          if option == 0:
              authority = None
          elif option == 1:
              authority = b58(program_data[13:45])
          else:
              raise SystemExit("ProgramData has an invalid authority encoding")
          artifact_hash = hashlib.sha256(program_data[45:]).hexdigest()
          exact = artifact_hash == expected_hash
          if authority is None:
              if not exact:
                  raise SystemExit("immutable program bytes do not match the reviewed artifact")
              print("immutable_exact")
          elif authority != expected_authority:
              raise SystemExit("program has an unexpected upgrade authority")
          elif not exact:
              raise SystemExit("mutable program bytes do not match the reviewed artifact; refusing replacement")
          else:
              print("mutable_exact")
          PY

          inspect() {
            python3 "$RUNNER_TEMP/inspect-loader.py" "$@"
          }
          finalized_balance() {
            ADDRESS="$1" python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              os.environ["ALLOWIT_DEVNET_RPC_URL"],
              data=json.dumps({
                  "jsonrpc":"2.0","id":1,"method":"getBalance",
                  "params":[os.environ["ADDRESS"],{"commitment":"finalized"}],
              }).encode(),
              headers={"content-type":"application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except Exception:
              raise SystemExit("Devnet RPC transport failed while reading deployer balance") from None
          if "error" in payload:
              raise SystemExit("Devnet RPC rejected deployer balance query")
          print(payload["result"]["value"])
          PY
          }
          verify_dump() {
            local name="$1" program_id="$2" expected_bytes="$3" expected_hash="$4"
            local dump="$RUNNER_TEMP/${name}-deployed.so"
            rm -f "$dump"
            if ! solana --url "$ALLOWIT_DEVNET_RPC_URL" --commitment finalized program dump "$program_id" "$dump" \
              > "$RUNNER_TEMP/${name}-dump.log" 2>&1; then
              echo "$name finalized byte dump failed; no raw CLI output was exposed." >&2
              exit 1
            fi
            test "$(stat -c %s "$dump")" = "$expected_bytes"
            test "$(sha256sum "$dump" | cut -d' ' -f1)" = "$expected_hash"
          }
          deploy_one() {
            local name="$1" artifact="$2" program_id="$3" program_key="$4"
            local buffer_key="$5" buffer_id="$6" expected_bytes="$7" expected_hash="$8"
            local state
            state="$(inspect program "$program_id" "$expected_bytes" "$expected_hash" "$EXPECTED_DEPLOYER")"
            case "$state" in
              immutable_exact)
                verify_dump "$name" "$program_id" "$expected_bytes" "$expected_hash"
                echo "$name is already immutable and byte-exact; no transaction submitted."
                return
                ;;
              mutable_exact)
                verify_dump "$name" "$program_id" "$expected_bytes" "$expected_hash"
                echo "$name is mutable but byte-exact; skipping upload and finalizing authority."
                ;;
              missing|incomplete)
                if [ "$(finalized_balance "$EXPECTED_DEPLOYER")" -lt 1300000000 ]; then
                  echo "$name needs at least 1.3 Devnet SOL in the deployer before an upload or resume." >&2
                  exit 1
                fi
                inspect buffer "$buffer_id" "$expected_bytes" "$expected_hash" "$EXPECTED_DEPLOYER" \
                  > "$RUNNER_TEMP/${name}-buffer-state.txt"
                if ! solana \
                  --url "$ALLOWIT_DEVNET_RPC_URL" \
                  --keypair "$RUNNER_TEMP/allowit-devnet-deployer.json" \
                  --commitment finalized \
                  program deploy "$artifact" \
                  --program-id "$program_key" \
                  --buffer "$buffer_key" \
                  --upgrade-authority "$RUNNER_TEMP/allowit-devnet-deployer.json" \
                  --max-len "$expected_bytes" \
                  --max-sign-attempts 10 \
                  --use-rpc \
                  > "$RUNNER_TEMP/${name}-deploy.log" 2>&1; then
                  echo "$name deploy failed; rerun with the same persistent program and buffer identities. Raw CLI output remains private to this ephemeral runner." >&2
                  exit 1
                fi
                test "$(inspect program "$program_id" "$expected_bytes" "$expected_hash" "$EXPECTED_DEPLOYER")" = "mutable_exact"
                verify_dump "$name" "$program_id" "$expected_bytes" "$expected_hash"
                ;;
              *)
                echo "$name returned an unsupported loader state." >&2
                exit 1
                ;;
            esac
            if ! solana \
              --url "$ALLOWIT_DEVNET_RPC_URL" \
              --keypair "$RUNNER_TEMP/allowit-devnet-deployer.json" \
              --commitment finalized \
              program set-upgrade-authority "$program_id" \
              --upgrade-authority "$RUNNER_TEMP/allowit-devnet-deployer.json" \
              --final \
              > "$RUNNER_TEMP/${name}-finalize.log" 2>&1; then
              echo "$name matched the reviewed bytes but authority finalization failed; rerun will verify and finalize it. Raw CLI output remains private to this ephemeral runner." >&2
              exit 1
            fi
            test "$(inspect program "$program_id" "$expected_bytes" "$expected_hash" "$EXPECTED_DEPLOYER")" = "immutable_exact"
            verify_dump "$name" "$program_id" "$expected_bytes" "$expected_hash"
          }

          deploy_one \
            policy "$RUNNER_TEMP/native-release/allowit_policy.so" \
            "$EXPECTED_POLICY_PROGRAM" "$RUNNER_TEMP/allowit-devnet-policy-program.json" \
            "$RUNNER_TEMP/allowit-devnet-policy-buffer.json" \
            "$EXPECTED_POLICY_BUFFER" \
            "$PINNED_POLICY_BYTES" "$PINNED_POLICY_SHA256"
          deploy_one \
            vault "$RUNNER_TEMP/native-release/allowit_vault.so" \
            "$EXPECTED_VAULT_PROGRAM" "$RUNNER_TEMP/allowit-devnet-vault-program.json" \
            "$RUNNER_TEMP/allowit-devnet-vault-buffer.json" \
            "$EXPECTED_VAULT_BUFFER" \
            "$PINNED_VAULT_BYTES" "$PINNED_VAULT_SHA256"
      - name: Fund only the bound autonomous executor when needed
        env:
          ALLOWIT_DEVNET_RPC_URL: ${{ secrets.ALLOWIT_DEVNET_RPC_URL }}
          EXPECTED_EXECUTOR: ${{ vars.ALLOWIT_DEVNET_EXECUTOR_PUBLIC_KEY }}
          EXPECTED_DEPLOYER: ${{ vars.ALLOWIT_DEVNET_DEPLOYER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          balance() {
            ADDRESS="$1" python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              os.environ["ALLOWIT_DEVNET_RPC_URL"],
              data=json.dumps({
                  "jsonrpc":"2.0","id":1,"method":"getBalance",
                  "params":[os.environ["ADDRESS"],{"commitment":"finalized"}],
              }).encode(),
              headers={"content-type":"application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except Exception:
              raise SystemExit("Devnet RPC transport failed while reading executor balance") from None
          if "error" in payload:
              raise SystemExit("Devnet RPC rejected executor balance query")
          print(payload["result"]["value"])
          PY
          }
          before="$(balance "$EXPECTED_EXECUTOR")"
          if [ "$before" -lt 50000000 ]; then
            deployer_balance="$(balance "$EXPECTED_DEPLOYER")"
            if [ "$deployer_balance" -lt 101000000 ]; then
              echo "Deployer lacks the fixed 0.1 Devnet SOL executor grant plus fees." >&2
              exit 1
            fi
            if ! solana \
              --url "$ALLOWIT_DEVNET_RPC_URL" \
              --keypair "$RUNNER_TEMP/allowit-devnet-deployer.json" \
              --commitment finalized \
              transfer "$EXPECTED_EXECUTOR" 0.1 \
              --allow-unfunded-recipient \
              > "$RUNNER_TEMP/executor-funding.log" 2>&1; then
              echo "fixed 0.1 Devnet SOL executor funding failed; raw CLI output remains private to this ephemeral runner." >&2
              exit 1
            fi
            after="$(balance "$EXPECTED_EXECUTOR")"
            test "$after" -ge 100000000
          else
            echo "Executor already has at least 0.05 Devnet SOL; no funding transaction submitted."
          fi
      - name: Create public finalized deployment evidence
        env:
          ALLOWIT_DEVNET_RPC_URL: ${{ secrets.ALLOWIT_DEVNET_RPC_URL }}
          EXPECTED_DEPLOYER: ${{ vars.ALLOWIT_DEVNET_DEPLOYER_PUBLIC_KEY }}
          EXPECTED_POLICY_PROGRAM: ${{ vars.ALLOWIT_DEVNET_POLICY_PROGRAM_ID }}
          EXPECTED_VAULT_PROGRAM: ${{ vars.ALLOWIT_DEVNET_VAULT_PROGRAM_ID }}
          EXPECTED_EXECUTOR: ${{ vars.ALLOWIT_DEVNET_EXECUTOR_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/native-deployment-evidence"
          mkdir -p "$evidence_dir"
          python3 - "$evidence_dir/deployment.json" <<'PY'
          import base64, datetime, hashlib, json, os, pathlib, sys, urllib.request
          ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          def b58(data):
              zeros = len(data) - len(data.lstrip(b"\0"))
              number = int.from_bytes(data, "big")
              text = ""
              while number:
                  number, index = divmod(number, 58)
                  text = ALPHABET[index] + text
              return "1" * zeros + (text or ("" if zeros else "1"))
          def rpc(method, params):
              request = urllib.request.Request(
                  os.environ["ALLOWIT_DEVNET_RPC_URL"],
                  data=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode(),
                  headers={"content-type":"application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except Exception:
                  raise SystemExit(f"Devnet RPC transport failed for {method}") from None
              if "error" in payload:
                  raise SystemExit(f"Devnet RPC rejected {method}")
              return payload["result"]
          def account(address):
              value = rpc("getAccountInfo", [
                  address, {"encoding":"base64","commitment":"finalized"}
              ])["value"]
              if value is None:
                  raise SystemExit(f"missing finalized account {address}")
              return value, base64.b64decode(value["data"][0])
          def program(name, address, expected_hash, expected_bytes):
              program_account, program_data_ref = account(address)
              program_data_address = b58(program_data_ref[4:36])
              _, program_data = account(program_data_address)
              artifact = program_data[45:]
              if program_data[12] != 0 or len(artifact) != expected_bytes:
                  raise SystemExit(f"{name} is not the exact immutable allocation")
              digest = hashlib.sha256(artifact).hexdigest()
              if digest != expected_hash:
                  raise SystemExit(f"{name} finalized bytes changed")
              signatures = rpc("getSignaturesForAddress", [
                  address, {"limit":20,"commitment":"finalized"}
              ])
              return {
                  "name": name,
                  "programId": address,
                  "programDataAddress": program_data_address,
                  "owner": program_account["owner"],
                  "authority": None,
                  "lastDeployedSlot": int.from_bytes(program_data[4:12], "little"),
                  "bytes": expected_bytes,
                  "sha256": digest,
                  "recentFinalizedSignatures": signatures,
              }
          evidence = {
              "schema": 1,
              "network": "solana:devnet",
              "genesisHash": rpc("getGenesisHash", []),
              "mint": os.environ["DEVNET_USDC_MINT"],
              "contractRevision": os.environ["PINNED_NATIVE_REVISION"],
              "workflowRevision": os.environ["GITHUB_SHA"],
              "workflowRun": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              "sourceBundle": os.environ["PINNED_SOURCE_BUNDLE"],
              "deployer": os.environ["EXPECTED_DEPLOYER"],
              "executor": os.environ["EXPECTED_EXECUTOR"],
              "executorFinalizedLamports": rpc("getBalance", [
                  os.environ["EXPECTED_EXECUTOR"], {"commitment":"finalized"}
              ])["value"],
              "createdAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "toolchain": {
                  "rust":"1.98.0","agave":"4.3.0","platformTools":"1.57","sbfArch":"v3"
              },
              "programs": [
                  program("policy", os.environ["EXPECTED_POLICY_PROGRAM"],
                          os.environ["PINNED_POLICY_SHA256"],
                          int(os.environ["PINNED_POLICY_BYTES"])),
                  program("vault", os.environ["EXPECTED_VAULT_PROGRAM"],
                          os.environ["PINNED_VAULT_SHA256"],
                          int(os.environ["PINNED_VAULT_BYTES"])),
              ],
          }
          if evidence["genesisHash"] != os.environ["DEVNET_GENESIS_HASH"]:
              raise SystemExit("genesis changed while producing evidence")
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          (cd "$evidence_dir" && sha256sum deployment.json > SHA256SUMS)
          {
            echo "### Immutable Solana Devnet deployment"
            echo
            echo "- workflow revision: \`$GITHUB_SHA\`"
            echo "- contract revision: \`$PINNED_NATIVE_REVISION\`"
            echo "- policy: \`$EXPECTED_POLICY_PROGRAM\`"
            echo "- vault: \`$EXPECTED_VAULT_PROGRAM\`"
            echo "- executor: \`$EXPECTED_EXECUTOR\`"
            echo "- source bundle: \`$PINNED_SOURCE_BUNDLE\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove decoded deployment keypairs
        if: always()
        run: |
          set -euo pipefail
          rm -f \
            "$RUNNER_TEMP/allowit-devnet-deployer.json" \
            "$RUNNER_TEMP/allowit-devnet-policy-program.json" \
            "$RUNNER_TEMP/allowit-devnet-vault-program.json" \
            "$RUNNER_TEMP/allowit-devnet-policy-buffer.json" \
            "$RUNNER_TEMP/allowit-devnet-vault-buffer.json"
      - name: Upload public deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: immutable-devnet-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/native-deployment-evidence
          if-no-files-found: error
          retention-days: 30
