name: Host service packages
on:
  pull_request:
    paths: ["crates/service-*/**", "crates/provider-*/**", "crates/paysh-catalog/**", "crates/delegated-x402/**", "crates/paysh-stock/**", "crates/paysh-cooperating/**", ".github/workflows/service-packages.yml"]
  push:
    paths: ["crates/service-*/**", "crates/provider-*/**", "crates/paysh-catalog/**", "crates/delegated-x402/**", "crates/paysh-stock/**", "crates/paysh-cooperating/**", ".github/workflows/service-packages.yml"]
permissions:
  contents: read
jobs:
  service-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [service-upstreams, service-rpc, provider-google-air-quality, provider-open-meteo, paysh-catalog, delegated-x402, paysh-stock, paysh-cooperating]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/${{ matrix.package }}
      - run: cargo fmt --manifest-path crates/${{ matrix.package }}/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/${{ matrix.package }}/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/${{ matrix.package }}/Cargo.toml --locked
