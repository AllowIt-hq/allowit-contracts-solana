[package]
name = "allowit-sbf-tests"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dev-dependencies]
allowit-sdk = { git = "https://github.com/allowit-hq/allowit-sdk.git", rev = "67f5d696847992e18131f815ce905713ec3646e1", features = ["compiler", "contract"] }
allowit-solana = { path = "..", features = ["no-entrypoint"] }
borsh = "=1.6.0"
bincode = "=1.3.3"
mollusk-svm = "=0.15.1"
mollusk-svm-programs-token = { version = "=0.15.1", default-features = false, features = ["token"] }
serde_json = "=1.0.150"
solana-account = "=4.3.1"
# Keep the official Mollusk serialization family together: later address
# releases switched wincode traits without a compatible instruction release.
solana-address = "=2.6.1"
solana-hash = "=4.4.0"
solana-instruction = "=3.4.0"
solana-message = "=4.4.0"
solana-program = "=2.3.0"
solana-program-error = "=3.0.1"
solana-pubkey = "=4.2.0"
solana-signature = "=3.4.1"
solana-transaction = { version = "=4.1.5", features = ["serde"] }
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
