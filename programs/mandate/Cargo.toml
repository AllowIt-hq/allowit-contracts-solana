[package]
name = "allowit-solana"
version.workspace = true
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["custom-heap"]
custom-heap = []
no-entrypoint = []

[dependencies]
allowit-sdk = { workspace = true, features = ["contract"] }
borsh = { version = "=1.6.0", features = ["derive"] }
solana-program = "=2.3.0"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
allowit-sdk = { workspace = true, features = ["std", "compiler", "oracle-ledger", "contract"] }
serde_json = "=1.0.150"
bincode = "=1.3.3"

[lints.rust]
unexpected_cfgs = { level = "allow" }
