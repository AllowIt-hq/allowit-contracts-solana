# Extends the default rules. The allowlisted values are public data in the
# hash-bound verification set, not credentials: SHA-256 digests of policy
# sources and SBF files, and Solana account addresses in the recorded test
# vectors. The verification files cannot change without breaking their locks.
[extend]
useDefault = true

[[allowlists]]
description = "Hash-bound digests and account addresses in verification/"
paths = ['''^verification/''']
regexes = [
  '''^70b783aac1a7d7016ea967cc6d873a91917f6ce3f38b030551f4658923b7793d$''',
  '''^7b44674b9704fa7640fbebfac68389f338b500b8c2bc29175c27ed66838b5a3c$''',
  '''^9b2602210007ec1a8f94aea978d63f2d5fffdb1943084c2f7e8181d6b1907d5a$''',
  '''^06ddf6e1d765a193d9cbe146ceeb79ac1cb485ed5f5b37913a8cf5857eff00a9$''',
  '''^52c7b8b745e52dc5dbd8b8bd8c344535556049de6c8251ff0f3d923e43f71454$''',
  '''^5cvUxsFFJD17zQMhaRNM3M57yrurPRbhGnCNkMhM36rF$''',
  '''^25hjHpTATmkdET17ynDhf1MCuYNDn1z7wXfVw5iaxLAK$''',
  '''^29d2S7vB453rNYFdR5Ycwt7y9haRT5fwVwL9zTmBhfV2$''',
