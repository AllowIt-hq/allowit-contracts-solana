[workspace]
members = [
    "crates/delegated-x402",
    "crates/interface",
    "crates/native",
    "crates/paysh-catalog",
    "crates/paysh-cooperating",
    "crates/paysh-interface",
    "crates/paysh-stock",
    "crates/provider-google-air-quality",
    "crates/provider-open-meteo",
    "crates/service-rpc",
    "crates/service-upstreams",
    "crates/solana-vendor",
    "programs/mandate",
    "programs/paysh",
    "programs/policy",
    "programs/vault",
]
# The SBF test harnesses pin the Mollusk crate family exactly. Those pins would
# change the programs' own dependencies, so each harness keeps its own lock.
exclude = ["sbf-tests", "programs/mandate/sbf-tests"]
resolver = "2"

# Every package in this repository builds at this version.
[workspace.package]
version = "0.1.0"

# The revision each git repository must be pinned to. scripts/build.sh checks
# every git dependency below against this table and fails on a stale pin.
[workspace.metadata.allowit.track]
allowit-sdk = "head"

[workspace.dependencies]
allowit-sdk = { git = "https://github.com/allowit-hq/allowit-sdk.git", rev = "2ce05b873baea0a32ba7a36bf4add4a60c491293", default-features = false }
allowit-interface = { path = "crates/interface" }
allowit-native = { path = "crates/native" }
solana-program = "=2.3.0"
borsh = { version = "=1.6.0", features = ["derive"] }

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
